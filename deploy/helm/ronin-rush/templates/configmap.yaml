apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ronin.fullname" . }}-api
  labels: {{- include "ronin.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  PORT: {{ .Values.api.port | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  KAFKA_BROKERS: {{ .Values.config.kafkaBrokers | quote }}
  CORS_ORIGIN: {{ .Values.config.corsOrigin | quote }}
  SENTRY_ENVIRONMENT: {{ .Values.config.sentryEnvironment | quote }}
  {{- range $k, $v := .Values.api.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
