{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ronin.fullname" . }}
  labels: {{- include "ronin.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        # Same origin for everything, like the nginx proxy in Docker Compose.
        paths:
          {{- range list "/api" "/socket.io" "/health" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service: { name: {{ include "ronin.fullname" $ }}-api, port: { name: http } }
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ include "ronin.fullname" . }}-web, port: { name: http } }
{{- end }}
