# Ronin Rush on a Synology DS918+ (DSM 7.1, Docker 20.10, docker-compose 1.28).
# File format 2.4 on purpose: mem_limit, healthcheck conditions and profiles, no newer syntax.
#
#   cd /volume1/docker/ronin-rush && sudo docker-compose -p ronin-rush up -d
#
# Only the nginx proxy (3310) and the API (3311, diagnostics) are published, both on loopback;
# Tailscale Funnel exposes 3310 publicly. Postgres and Redis publish nothing.
#
# Networking: on this NAS, TCP between containers on a bridge network times out although DNS
# resolves (reproduced 2026-11-11: api → postgres/redis/web all TIMEOUT). So every service joins
# ONE network namespace, owned by this project's redis container, and talks over 127.0.0.1.
# The namespace is private to ronin-rush; ports are published on the redis service.
version: "2.4"

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ronin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ronin
    network_mode: "service:redis"
    depends_on: [redis]
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "effective_cache_size=192MB"]
    volumes: ["./data/postgres:/var/lib/postgresql/data"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ronin -d ronin"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no", "--maxmemory", "48mb", "--maxmemory-policy", "noeviction"]
    # Owner of the shared namespace: the published ports of the whole stack live here.
    ports: ["127.0.0.1:3310:8080", "127.0.0.1:3311:3001"]
    volumes: ["./data/redis:/data"]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging

  api:
    image: ronin-rush-api:${RONIN_TAG:?set in .env}
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: "3001"
      INSTANCE_ID: nas-api-1
      DATABASE_URL: postgres://ronin:${POSTGRES_PASSWORD}@127.0.0.1:5432/ronin
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_NAMESPACE: ronin-nas
      DB_POOL_SIZE: "10"
      NODE_OPTIONS: --max-old-space-size=256
    network_mode: "service:redis"
    mem_limit: 384m
    # Cold start on the NAS (Celeron, HDD) spends ~90 s just loading modules (measured 2026-11-11),
    # so the image's 40 s start period marked it unhealthy before it could listen.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 300s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    logging: *logging

  web:
    image: ronin-rush-web:${RONIN_TAG}
    restart: unless-stopped
    network_mode: "service:redis"
    depends_on: [redis]
    environment:
      NODE_OPTIONS: --max-old-space-size=128
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 180s
    logging: *logging

  proxy:
    image: ronin-rush-proxy:${RONIN_TAG}
    restart: unless-stopped
    environment:
      API_UPSTREAM: 127.0.0.1:3001
      WEB_UPSTREAM: 127.0.0.1:3000
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-https://danielgil.eu https://www.danielgil.eu}
    network_mode: "service:redis"
    mem_limit: 64m
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    logging: *logging

  # Own single-node Kafka (KRaft), only with `--profile kafka` (≈ 600 MB). Set KAFKA_BROKERS=127.0.0.1:9092.
  # Same image the platform stack already uses on this NAS (apache/kafka 3.9.1), so nothing new to pull.
  kafka:
    image: apache/kafka:3.9.1
    profiles: ["kafka"]
    restart: unless-stopped
    network_mode: "service:redis"
    depends_on: [redis]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_RETENTION_HOURS: "48"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms192m -Xmx384m
    volumes: ["./data/kafka:/var/lib/kafka/data"]
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    logging: *logging
